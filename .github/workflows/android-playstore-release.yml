name: Fuego Wallet Android Play Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release (e.g. 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build but do not submit"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.44.4"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Enable Android support
        run: flutter config --enable-android

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-cache-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-cache-android-

      - name: Install dependencies
        run: |
          for retry in 1 2 3; do
            if flutter pub get; then
              echo "✅ Flutter pub get successful on attempt $retry"
              break
            fi
            echo "❌ Flutter pub get failed on attempt $retry, retrying in 10 seconds..."
            sleep 10
          done

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        continue-on-error: true
        run: flutter test --coverage

      - name: Build Android natives (fuego-ffi, fuego_walletd)
        uses: ./.github/actions/build-android-natives

      - name: Setup Android keystore
        if: inputs.dry_run == false
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30